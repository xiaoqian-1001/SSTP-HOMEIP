name: Fetch vpngate SSTP Servers

on:
  schedule:
    # 每 6 小时抓取一次，可自行调整 cron
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-sstp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect vpngate page structure
        run: |
          curl -sL --max-time 60 "https://www.vpngate.net/cn/" -o /tmp/vg.html || exit 1
          echo "HTML size: $(wc -c < /tmp/vg.html)"
          echo "===== lines mentioning sstp ====="
          grep -n -i "sstp" /tmp/vg.html | head -10 || echo "no sstp found"
          echo "===== table headers ====="
          grep -o '<th[^>]*>[^<]*</th>' /tmp/vg.html | head -40
          echo "===== first table rows ====="
          python3 - <<'PY'
import re
text = open('/tmp/vg.html', encoding='utf-8', errors='replace').read()
rows = re.findall(r'<tr[^>]*>.*?</tr>', text, re.S)
print("table rows found:", len(rows))
for r in rows[:3]:
    cells = re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S)
    cells = [re.sub(r'<[^>]+>', '', c).strip()[:50] for c in cells]
    print(cells)
PY

      - name: Fetch and generate SSTP server list
        run: python scripts/fetch_sstp.py

      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add sstp-list.txt sstp.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update vpngate SSTP server list [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "$BRANCH"
