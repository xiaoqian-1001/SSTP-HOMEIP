name: Fetch vpngate SSTP Servers

on:
  schedule:
    # 每 6 小时抓取一次，可自行调整 cron
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-sstp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect vpngate page structure
        run: python scripts/inspect_page.py

      - name: Fetch and generate SSTP server list
        run: python scripts/fetch_sstp.py

      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add sstp-list.txt sstp.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update vpngate SSTP server list [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "$BRANCH"
